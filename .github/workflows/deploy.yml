name: Build And Deploy milkonomy
permissions:
  contents: write
# 允许手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
        description: 是否强制打包部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@master
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Build
        run: pnpm install && pnpm build:staging

      # fix https://github.com/vitejs/vite/issues/9119
      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: dist
          clean: false # 不清除dist/public/data的内容
